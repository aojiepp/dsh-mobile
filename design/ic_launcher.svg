<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="432" height="432">
  <!-- DSH Mobile 图标源：蓝色大肥鱼 / 鲸鱼娘（半睁困眼 · 白色荷叶边发带 · 蓝色蝴蝶结 · 鲸鱼鳍）
       只画前景层；背景色由 adaptive-icon 的 ic_launcher_bg 提供。内容缩进 66/108dp 安全区。 -->
  <g transform="translate(54,54) scale(0.86) translate(-54,-54)">

    <!-- 鲸鱼胸鳍（在头发后面，向外上翘） -->
