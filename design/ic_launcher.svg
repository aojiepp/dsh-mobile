      <path d="M30,64 C22,58 12,54 11,60 C10,67 20,74 31,74 Z"/>
      <path d="M78,64 C86,58 96,54 97,60 C98,67 88,74 77,74 Z"/>
    </g>
    <g stroke="#4C6BA8" stroke-width="1.6" stroke-linecap="round" fill="none">
      <path d="M16,60 C20,64 24,67 28,69"/>
      <path d="M92,60 C88,64 84,67 80,69"/>
    </g>

    <!-- 后方头发 -->
    <path d="M54,21 C77,21 89,38 89,61 C89,77 84,89 76,91
             C68,93 60,89 54,90 C48,89 40,93 32,91
             C24,89 19,77 19,61 C19,38 31,21 54,21 Z" fill="#3A4C86"/>

    <!-- 脸 -->
    <ellipse cx="54" cy="66" rx="21.5" ry="20.5" fill="#FDEDE2"/>

