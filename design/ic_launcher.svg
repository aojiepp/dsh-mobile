    <path d="M36.5,65.3 C39.7,63.1 47.3,63.1 50.5,65.3"
          fill="none" stroke="#2C3F72" stroke-width="2.1" stroke-linecap="round"/>
    <circle cx="46.4" cy="70" r="2.3" fill="#FFFFFF" opacity="0.96"/>
    <circle cx="40.8" cy="72" r="1" fill="#FFFFFF" opacity="0.65"/>

    <!-- 右眼 -->
    <ellipse cx="64.5" cy="67" rx="7.2" ry="8.2" fill="#3F5FB0"/>
    <path d="M57.3,65.2 C57.8,61.2 60.8,58.8 64.5,58.8
