      <circle cx="44" cy="31" r="3.2"/><circle cx="50" cy="29" r="3.2"/>
      <circle cx="58" cy="29" r="3.2"/><circle cx="64" cy="31" r="3.2"/>
      <circle cx="71" cy="35" r="3.2"/><circle cx="77" cy="42" r="3.2"/>
    </g>

    <!-- 右侧小蓝蝴蝶结（贴在发带右端） -->
    <path d="M77,39 L84,34 L84,45 Z" fill="#6C8BFF"/>
    <path d="M77,39 L70,34 L70,45 Z" fill="#6C8BFF"/>
    <circle cx="77" cy="39.5" r="2.1" fill="#FFFFFF"/>

    <!-- 左眼：大虹膜 + 上眼睑压下来 + 睫毛线 -->
    <ellipse cx="43.5" cy="67" rx="7.2" ry="8.2" fill="#3F5FB0"/>
    <path d="M36.3,65.2 C36.8,61.2 39.8,58.8 43.5,58.8
