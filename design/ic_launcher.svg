    <path d="M44,42 C41,47 39,52 39,57 C41,52 44,48 47,45 Z" fill="#3A4C86"/>
    <path d="M56,27 C64,29 70,35 73,43 C68,36 63,31 55,29 Z" fill="#6C86C6" opacity="0.9"/>

    <!-- 两侧鬓发 -->
    <path d="M28,60 C25,72 26,85 31,90 C29,79 30,70 33,64 Z" fill="#3A4C86"/>
    <path d="M80,60 C83,72 82,85 77,90 C79,79 78,70 75,64 Z" fill="#3A4C86"/>

    <!-- 白色荷叶边发带（贴在头顶，宽度约占头 2/3） -->
