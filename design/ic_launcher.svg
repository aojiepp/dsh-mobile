    <circle cx="67.4" cy="70" r="2.3" fill="#FFFFFF" opacity="0.96"/>
    <circle cx="61.8" cy="72" r="1" fill="#FFFFFF" opacity="0.65"/>

    <!-- 腮红 -->
    <ellipse cx="32" cy="75" rx="4.8" ry="2.7" fill="#F7B3BE" opacity="0.9"/>
    <ellipse cx="76" cy="75" rx="4.8" ry="2.7" fill="#F7B3BE" opacity="0.9"/>

    <!-- 小嘴 -->
    <path d="M51.6,79 C52.8,80.6 53.7,80.8 54,80.8 C54.3,80.8 55.2,80.6 56.4,79"
          fill="none" stroke="#D08490" stroke-width="1.8" stroke-linecap="round"/>
